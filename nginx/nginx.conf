# Design Ref: §16.3 — farmos-ec2-deploy Module 2 (v0.3, CloudFlare Flexible 대응)
# Plan SC: SC-2 (/health 200), R12 완화 (CF Flexible 무한 리다이렉트 방지)
#
# v0.3 결정 (이슈 B): proxy_pass http://farmos_api;  (trailing slash 없음, 변경 금지)
#   frontend grep: 모든 fetch가 `/api/v1/*` 패턴으로 호출 (예: useDailyJournal.ts, AuthContext.tsx).
#   backend API_V1_PREFIX=/api/v1 (config.py:14, .env.tmpl).
#   slash 없는 proxy_pass → 클라이언트의 `/api/v1/auth/login` 이 그대로 backend로 전달 → FastAPI router(prefix=/api/v1) 매칭.
#   slash를 추가하면 (`proxy_pass http://farmos_api/;`) `/api/`가 잘려 backend는 `/auth/login` 만 받게 되어 매칭 실패.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;
    server_tokens off;
    client_max_body_size 25m;  # 진단 이미지 업로드 고려

    # ────────────────────────────────────────────────
    # CloudFlare Flexible SSL 대응 (D6)
    # ────────────────────────────────────────────────
    # CF → 오리진은 항상 HTTP(80) 평문.
    # CF가 X-Forwarded-Proto 헤더로 원본 클라이언트의 프로토콜을 알려줌 (https or http).
    # nginx는 절대로 무조건 HTTPS 리다이렉트 해서는 안 됨 (무한 루프).
    # 클라이언트의 실제 scheme이 필요한 경우 $real_scheme 변수를 사용.
    map $http_x_forwarded_proto $real_scheme {
        default $scheme;     # CF 헤더 없으면 nginx의 $scheme (http) 사용
        https   https;
        http    http;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml;

    # 로그 — CF-Connecting-IP를 함께 기록해 원본 사용자 IP 추적
    log_format main '$remote_addr ($http_cf_connecting_ip) - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time" xfp=$http_x_forwarded_proto';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    upstream farmos_api {
        server api:8000;
        keepalive 32;
    }

    upstream shop_api {
        server shop-api:4000;
        keepalive 32;
    }

    # ────────────────────────────────────────────────
    # shopping_mall.<도메인> — 서브도메인 매칭
    # 정규식 server_name: 도메인 무관하게 'shoppingmall.' 으로 시작하면 모두 매칭
    # (예: shoppingmall.foo.com, shoppingmall.bar.org 모두 OK)
    # ────────────────────────────────────────────────
    server {
        listen 80;
        server_name ~^shoppingmall\.;

        root /usr/share/nginx/html-shop;
        index index.html;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        # shop-api (FastAPI:4000) 프록시
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_pass http://shop_api;
        }

        # 정적 자산 — 1년 immutable 캐시
        location ~* ^/assets/.*\.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }

    # ────────────────────────────────────────────────
    # farmos (default_server) — EIP 직접 접속, farmos.<도메인>, 그 외 모든 hostname
    # ────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ⚠️ DO NOT ADD: return 301 https://$host$request_uri;
        # CloudFlare Flexible 모드에서 이 코드를 추가하면
        # CF (https) → nginx (301 https) → CF (https) → ... 무한 루프 발생.
        # HTTPS 강제는 CloudFlare 대시보드의 "Always Use HTTPS"가 처리한다.

        # CodeDeploy ValidateService 훅이 호출하는 경로 (LB-less 단일 호스트)
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        # API 프록시 — X-Forwarded-Proto는 CF 원본 scheme을 그대로 전달
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;  # CF 원본 scheme
            proxy_set_header Connection        "";
            proxy_read_timeout  60s;
            proxy_send_timeout  60s;
            proxy_pass http://farmos_api;
        }

        # SSE / 스트리밍 (LangGraph agent stream 용)
        location /api/stream/ {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Connection        "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_pass http://farmos_api;
        }

        # 정적 자산 — 1년 immutable 캐시 (CF가 추가로 캐싱)
        location ~* ^/assets/.*\.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA fallback — index.html은 캐시 금지 (배포 즉시 반영)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
