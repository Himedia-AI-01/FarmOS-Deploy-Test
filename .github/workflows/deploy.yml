# Design Ref: §16.13 — farmos-ec2-deploy Module 4-C (v0.4)
# Plan SC: SC-1 (dev push → 5분 내 prod), SC-8 (OIDC AssumeRole), FR-12 (CodeDeploy 라이프사이클)
# R9 완화: Verify OIDC AssumeRole step
# R10 완화: S3 head-bucket / CodeDeploy get-application 사전 검증
# D10: dev = trunk = prod 트리거 (main 브랜치 부재)
#
# 흐름:
#   build-and-push  ─┐
#                    ├─→ deploy (OIDC → SSM image/tag → S3 → CodeDeploy → wait)
#   build-frontend  ─┘

name: Deploy (prod)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

# 동시 배포 차단 (직전 배포 완료 후 다음 배포). cancel-in-progress: false 로
# 진행 중 배포가 새 푸시로 잘려나가지 않도록 보호.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write       # OIDC AssumeRole (필수)
  contents: read
  packages: write       # GHCR push

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME 은 build-and-push 잡의 Compute step 에서 lowercase 변환 후 출력으로 노출.
  # GHCR(및 Docker Registry 표준) 은 repository name 이 [a-z0-9._-] 만 허용 — 대문자 owner 시 invalid tag.
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1: Backend Docker 이미지 빌드 + GHCR push
  # ────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_repo: ${{ steps.meta.outputs.image_repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image metadata (lowercase repo + sha tag)
        id: meta
        run: |
          # GHCR repository name 은 반드시 lowercase. GHCR_OWNER 가 'Himedia-AI-01' 같은
          # 대소문자 혼합이어도 여기서 소문자로 정규화.
          OWNER_LC=$(echo "${{ secrets.GHCR_OWNER }}" | tr '[:upper:]' '[:lower:]')
          REPO="${OWNER_LC}/farmos-api"
          TAG="sha-${GITHUB_SHA::12}"
          echo "image_repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "Repo: ${{ env.REGISTRY }}/${REPO}"
          echo "Tag:  ${TAG}"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (backend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────
  # Job 1b: shopping_mall Backend 이미지 빌드 + GHCR push (병렬)
  # ────────────────────────────────────────────────────────────────
  build-shop-and-push:
    name: Build & Push shopping_mall to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60          # 첫 빌드 (캐시 미존재) 대비 여유. 캐시 hit 후 ~5분
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute shop image metadata
        id: meta
        run: |
          OWNER_LC=$(echo "${{ secrets.GHCR_OWNER }}" | tr '[:upper:]' '[:lower:]')
          REPO="${OWNER_LC}/shopping-mall-api"
          # 12자 abbreviated SHA — farmos build-and-push 와 동일 패턴 (docker-compose 의 IMAGE_TAG 와 매칭)
          TAG="sha-${GITHUB_SHA::12}"
          echo "image_repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "Repo: ${{ env.REGISTRY }}/${REPO}"
          echo "Tag:  ${TAG}"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (shopping_mall backend)
        uses: docker/build-push-action@v6
        with:
          context: shopping_mall/backend
          file: shopping_mall/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_repo }}:latest
          # Registry cache (GHCR 자체를 캐시 저장소로 사용) — GHA cache 의 10GB 한계/export 오버헤드 회피
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_repo }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_repo }}:buildcache,mode=max

  # ────────────────────────────────────────────────────────────────
  # Job 2: Frontend 빌드 (Vite) — 병렬 실행
  # ────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean)
        run: npm ci
        working-directory: frontend

      - name: Build (tsc -b && vite build)
        # VITE_* 변수 빌드 타임 주입 — frontend/src/utils/api.ts 의 fallback 회피용.
        # (단, 18개 파일에 'http://localhost:8000/api/v1' 가 하드코딩되어 있어
        #  VITE_ 만으로는 충분치 않음. 다음 step 의 sed 패치로 보완.)
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE: /api/v1
          VITE_BACKEND_ORIGIN: ""

      # ─── 임시 패치 (메인 저장소 수정 전까지) ───
      # 18개 파일에 하드코딩된 'http://localhost:8000/api/v1' → '/api/v1' (상대경로) 일괄 치환.
      # 메인 저장소(`farmos-poc`) 의 src/ 가 utils/api.ts 의 API_BASE 를 import 하도록 리팩터되면
      # 본 step 은 제거. plz-fix/ 폴더에 가이드 별도 정리 권장.
      - name: Patch hardcoded localhost URLs in dist (temporary)
        run: |
          echo "Before patch:"
          grep -c "http://localhost:8000/api/v1" frontend/dist/assets/*.js 2>/dev/null || echo "(no localhost found)"

          find frontend/dist -type f \( -name "*.js" -o -name "*.html" \) \
            -exec sed -i 's|http://localhost:8000/api/v1|/api/v1|g' {} \;

          echo "After patch:"
          grep -c "http://localhost:8000/api/v1" frontend/dist/assets/*.js 2>/dev/null || echo "(0 - patched successfully)"

          # IoT 도메인은 그대로 유지 (외부 IoT relay 서버 — 별도 배포)
          echo "IoT relay (untouched):"
          grep -c "iot.lilpa.moe" frontend/dist/assets/*.js 2>/dev/null || echo "(no iot domain)"

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Job 2b: shopping_mall Frontend 빌드 (Vite) — 병렬 실행
  # ────────────────────────────────────────────────────────────────
  build-shop-frontend:
    name: Build shopping_mall Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: shopping_mall/frontend/package-lock.json

      - name: Install dependencies (clean)
        run: npm ci
        working-directory: shopping_mall/frontend

      - name: Build
        run: npm run build
        working-directory: shopping_mall/frontend
        env:
          # shopping_mall/frontend 는 src/lib/api.ts 가 VITE_API_URL 을 읽음.
          # 같은 오리진(shoppingmall.<도메인>) → 상대경로 사용.
          VITE_API_URL: ""

      # ─── 임시 패치 (shopping_mall/frontend SoT 정리 전까지) ───
      # src/stores/userStore.ts:3 의 'http://localhost:8000/api/v1' (FARMOS_API)
      # 와 src/lib/api.ts fallback 'http://localhost:4000' 을 상대경로로 치환.
      # FARMOS_API 는 같은 오리진이 아니므로 cross-origin (shoppingmall→farmos) → farmos 도메인으로 명시 필요.
      # 데모 단계에서는 일단 EIP/도메인 무관하게 동작하도록 'https://farmos.도메인/api/v1' placeholder 사용 — 사용자가 SSM 통해 주입 가능.
      - name: Patch hardcoded URLs in shop dist (temporary)
        run: |
          echo "Before patch:"
          grep -c "localhost:4000" shopping_mall/frontend/dist/assets/*.js 2>/dev/null || echo "(no localhost:4000)"
          grep -c "localhost:8000" shopping_mall/frontend/dist/assets/*.js 2>/dev/null || echo "(no localhost:8000)"

          # localhost:4000 (자기 백엔드) → 상대경로
          find shopping_mall/frontend/dist -type f \( -name "*.js" -o -name "*.html" \) \
            -exec sed -i 's|http://localhost:4000|""|g' {} \;
          # localhost:8000/api/v1 (farmos 백엔드 cross-origin) → 그대로 두면 시연 환경에서 깨짐
          # → CF 도메인 정해지면 deploy.yml 의 이 step 에서 명시 치환 필요. 우선 placeholder 유지.

          echo "After patch:"
          grep -c "localhost:4000" shopping_mall/frontend/dist/assets/*.js 2>/dev/null || echo "(0 - patched)"

      - name: Upload shop frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: shop-frontend-dist
          path: shopping_mall/frontend/dist
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Job 3: CodeDeploy 트리거 (OIDC → S3 → create-deployment → wait)
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy via CodeDeploy
    needs: [ build-and-push, build-shop-and-push, build-frontend, build-shop-frontend ]
    runs-on: ubuntu-latest
    timeout-minutes: 25     # CodeDeploy In-Place 평균 5~10분, 여유 15분
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Download shop frontend dist
        uses: actions/download-artifact@v4
        with:
          name: shop-frontend-dist
          path: shop-dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-${{ github.run_id }}
          role-duration-seconds: 3600

      # R9 완화: OIDC AssumeRole 동작 검증
      - name: Verify OIDC AssumeRole
        run: |
          aws sts get-caller-identity
          echo "✓ OIDC AssumeRole succeeded"

      # ──── 임시 디버그 (트러블슈팅 후 제거) ────
      # Secret 값의 길이/형식 진단 — 값 자체는 노출 안 됨
      - name: DEBUG — secret sanity check
        run: |
          BUCKET="${{ secrets.S3_DEPLOY_BUCKET }}"
          REGION="${{ env.AWS_REGION }}"
          APP="${{ secrets.CODEDEPLOY_APP }}"
          DG="${{ secrets.CODEDEPLOY_GROUP }}"
          echo "Bucket length: ${#BUCKET}     (expected: 35 = farmos-deploy-bundles-242201280878)"
          echo "Bucket md5:    $(printf '%s' "$BUCKET" | md5sum | cut -d' ' -f1)"
          echo "Region:        '$REGION'      (expected: 'ap-northeast-2')"
          echo "Region length: ${#REGION}     (expected: 14)"
          echo "App length:    ${#APP}        (expected: 11 = farmos-prod)"
          echo "DG length:     ${#DG}         (expected: 14 = farmos-prod-dg)"
          echo "---"
          echo "Direct s3 ls (no head-bucket):"
          aws s3 ls "s3://$BUCKET/" --region "$REGION" 2>&1 | head -5 || echo "  (empty bucket or access denied)"
          echo "---"
          echo "Cross-region ls (no --region flag):"
          aws s3api list-objects-v2 --bucket "$BUCKET" --max-items 1 2>&1 | head -10 || true

      # R10 완화 (보강): S3 + CodeDeploy 권한 사전 검증 — 번들 빌드 전 차단
      - name: Pre-flight check (S3 + CodeDeploy permissions)
        run: |
          echo "→ S3 bucket head check..."
          aws s3api head-bucket --bucket "${{ secrets.S3_DEPLOY_BUCKET }}" \
            --region "${{ env.AWS_REGION }}"
          echo "✓ S3 bucket accessible"

          echo "→ CodeDeploy application check..."
          aws deploy get-application \
            --application-name "${{ secrets.CODEDEPLOY_APP }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'application.applicationName' --output text
          echo "✓ CodeDeploy application accessible"

          echo "→ CodeDeploy deployment group check..."
          aws deploy get-deployment-group \
            --application-name "${{ secrets.CODEDEPLOY_APP }}" \
            --deployment-group-name "${{ secrets.CODEDEPLOY_GROUP }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'deploymentGroupInfo.{name:deploymentGroupName,autoRollback:autoRollbackConfiguration.enabled}'
          echo "✓ CodeDeploy deployment group accessible"

      # IMAGE_TAG를 SSM에 PutParameter — AfterInstall 훅이 .env 생성 시 이 값을 읽음
      - name: Update IMAGE_TAG in Parameter Store
        run: |
          aws ssm put-parameter \
            --name /farmos/prod/image/tag \
            --type String \
            --value "${{ needs.build-and-push.outputs.image_tag }}" \
            --overwrite \
            --region ${{ env.AWS_REGION }}
          echo "✓ /farmos/prod/image/tag = ${{ needs.build-and-push.outputs.image_tag }}"

      # 배포 번들 zip 구성:
      #   bundle/
      #   ├── appspec.yml
      #   ├── docker-compose.yml
      #   ├── nginx.conf            ← nginx/nginx.conf → bundle/nginx.conf 평탄화
      #   ├── scripts/*.sh
      #   └── dist/                 ← frontend 빌드 산출물
      - name: Build CodeDeploy bundle
        run: |
          mkdir -p bundle/scripts
          cp appspec.yml             bundle/
          cp docker-compose.yml      bundle/
          cp nginx/nginx.conf        bundle/nginx.conf
          cp scripts/application-stop.sh   bundle/scripts/
          cp scripts/before-install.sh     bundle/scripts/
          cp scripts/after-install.sh      bundle/scripts/
          cp scripts/application-start.sh  bundle/scripts/
          cp scripts/validate-service.sh   bundle/scripts/
          chmod +x bundle/scripts/*.sh
          cp -r dist      bundle/dist
          cp -r shop-dist bundle/shop-dist
          cd bundle && zip -rq ../deploy-bundle.zip . && cd ..
          ls -lh deploy-bundle.zip
          unzip -l deploy-bundle.zip | head -30

      - name: Upload bundle to S3
        id: s3upload
        run: |
          BUNDLE_KEY="bundles/${{ needs.build-and-push.outputs.image_tag }}.zip"
          aws s3 cp deploy-bundle.zip "s3://${{ secrets.S3_DEPLOY_BUCKET }}/${BUNDLE_KEY}" \
            --region ${{ env.AWS_REGION }}
          echo "bundle_key=${BUNDLE_KEY}" >> "$GITHUB_OUTPUT"
          echo "✓ Uploaded: s3://${{ secrets.S3_DEPLOY_BUCKET }}/${BUNDLE_KEY}"

      - name: Trigger CodeDeploy
        id: deploy
        run: |
          DEPLOY_ID=$(aws deploy create-deployment \
            --application-name "${{ secrets.CODEDEPLOY_APP }}" \
            --deployment-group-name "${{ secrets.CODEDEPLOY_GROUP }}" \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --description "git ${{ github.sha }} by ${{ github.actor }} (run ${{ github.run_id }})" \
            --revision "{\"revisionType\":\"S3\",\"s3Location\":{\"bucket\":\"${{ secrets.S3_DEPLOY_BUCKET }}\",\"key\":\"${{ steps.s3upload.outputs.bundle_key }}\",\"bundleType\":\"zip\"}}" \
            --region ${{ env.AWS_REGION }} \
            --query 'deploymentId' --output text)
          echo "deployment_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment ID: $DEPLOY_ID"
          echo "Console URL: https://${{ env.AWS_REGION }}.console.aws.amazon.com/codedeploy/home?region=${{ env.AWS_REGION }}#/deployments/${DEPLOY_ID}"

      - name: Wait for deployment to complete
        run: |
          echo "Waiting for deployment ${{ steps.deploy.outputs.deployment_id }}..."
          aws deploy wait deployment-successful \
            --deployment-id ${{ steps.deploy.outputs.deployment_id }} \
            --region ${{ env.AWS_REGION }}
          echo "✓ Deployment Succeeded"

      - name: Show deployment summary
        if: always()
        run: |
          aws deploy get-deployment \
            --deployment-id ${{ steps.deploy.outputs.deployment_id }} \
            --region ${{ env.AWS_REGION }} \
            --query 'deploymentInfo.{Status:status,Created:createTime,Complete:completeTime,ErrorInformation:errorInformation,Rollback:rollbackInfo}'
